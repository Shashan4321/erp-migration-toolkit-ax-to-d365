name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrate-and-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Full run - generate, profile, migrate, reconcile (fails the build on any mismatch)
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: migration-reports
          path: reports/
